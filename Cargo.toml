[package]
name = "jqplay"
version = "1.5.2"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for exploring JSON with jq, inspired by jqplay.org"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "jqplay"
path = "src/lib.rs"

[[bin]]
name = "jqplay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
ratatui = "0.30"
rustix = { version = "1", features = ["stdio", "termios", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[dev-dependencies]
expectrl = "0.9"
insta = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
